; SAEG-2026 - Sistema de Monitoramento e Controle Termico ESP8266
; Referencia: .specs/codebase/STACK.md | .specs/features/controle-termico/tasks.md

[platformio]
default_envs = nodemcuv2

[env]
monitor_speed = 115200

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = none
board_build.f_cpu = 160000000L
extra_scripts =
    pre:tools/gen_dashboard.py
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Testes HOST da logica pura (lib/thermocore): FSM + agendador de buzzer.
; test_build_src=false evita compilar src/ (depende de Arduino) no host.
[env:native]
platform = native
test_framework = unity
test_build_src = false
